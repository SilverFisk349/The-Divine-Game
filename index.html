<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#141b1b"><title>The Divine Game</title><style>
:root{color-scheme:dark;--bg:#111817;--panel:#1d2826;--line:#344641;--text:#e7e5d7;--muted:#a5b0a3;--gold:#e3c185;--red:#d36e69;--green:#83bd8c;--blue:#72a9dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#27372e 0,#111817 62%);color:var(--text);font:15px/1.45 system-ui,sans-serif;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer;background:#34463d;color:var(--text);border:1px solid #52675a;border-radius:7px;padding:10px 13px;font-weight:650;min-height:44px}button:hover:not(:disabled){background:#485c4f}button:disabled{opacity:.42;cursor:default}button.primary{background:var(--gold);color:#29261d;border-color:var(--gold)}button.danger{border-color:#a96862;color:#ffd0c9;background:#472d2b}button.ghost{background:transparent}button.small{padding:5px 9px;min-height:36px;font-size:13px}button.active{border-color:var(--gold);color:var(--gold)}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:normal;color:var(--gold)}h1{font-size:clamp(36px,8vw,64px);line-height:1.05}h2{font-size:26px}h3{font-size:15px}small,.muted{color:var(--muted)}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:700}.shell{max-width:1000px;margin:auto;padding:14px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 15px}.brand{font-family:Georgia,serif;color:var(--gold);font-size:21px}.version{font-size:11px;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;min-width:0}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.center{text-align:center;justify-content:center}.hero{max-width:600px;margin:5vh auto 0;text-align:center;display:grid;gap:18px}.hero .panel{padding:24px}.hero button{width:100%}.scene{width:100%;display:block;aspect-ratio: 16/8;background:#172924;border:1px solid var(--line);border-radius:8px;image-rendering:pixelated}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px;align-items:start}.nav{display:flex;gap:6px;overflow:auto;padding:0 0 3px}.nav button{flex:1;white-space:nowrap}.bar{height:9px;background:#101716;border-radius:5px;overflow:hidden;margin:4px 0 8px}.bar i{height:100%;display:block;transition:width .2s;background:var(--green)}.bar.hp i{background:var(--red)}.bar.mp i{background:var(--blue)}.bar.xp i,.bar.progress i{background:var(--gold)}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{padding:7px 8px;background:#17211f;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:4px}.stat b{color:var(--gold)}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.skill{padding:8px 5px;background:#16201e;border:1px solid var(--line);border-radius:6px;text-align:center;min-width:0}.skill span{display:block;font-size:19px}.skill small{font-size:11px}.log{height:116px;overflow:auto;font-size:12px;color:#c2cdc0;background:#141d1b;border-radius:5px;padding:8px}.log div{padding:2px 0;border-bottom:1px solid #25322e}.loot{display:grid;gap:6px}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px;background:#16201e;border-radius:6px;border:1px solid var(--line)}.item small{display:block}.common{color:#d5d6cd}.uncommon{color:#8dd995}.rare{color:#8dbbf5}.epic{color:#c99bf1}.legendary{color:#ffc278}.notice{border:1px solid #7b6540;padding:10px;border-radius:6px;color:#f0d9aa;background:#322c20}.fields{text-align:left;display:grid;gap:10px}label{display:grid;gap:5px;color:var(--muted)}input,select{background:#141d1b;color:var(--text);border:1px solid #52675a;border-radius:6px;padding:11px;width:100%}.portrait{width:130px;height:130px;margin:auto;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;background:#17221e}.big{font-size:22px;color:var(--gold)}.quote{font:21px/1.5 Georgia,serif;color:#e5d6b9}.locked{opacity:.55}.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:20px}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:15px}.buttons2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dangertext{color:var(--red)}.greentext{color:var(--green)}.gold{color:var(--gold)}.nowrap{white-space:nowrap}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#33453b;border:1px solid #718471;border-radius:8px;padding:10px 14px;z-index:10;max-width:90%;box-shadow:0 4px 30px #0009}#toast:empty{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}.shell{padding:10px 10px 24px}.hero{margin-top:2vh}.panel{padding:12px}.top{margin-bottom:10px}.scene{aspect-ratio:16/9}.nav button{font-size:13px;padding:8px}.log{height:98px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="shell"><header class="top"><div class="brand">✧ The Divine Game</div><span class="version">Prototype 0.1 · One life</span></header><div id="app"></div><div class="footer" id="footer">Local save · No account · No server</div></main><div id="toast" role="status"></div><script>
'use strict';
const KEY='the-divine-game-v01', $=id=>document.getElementById(id), app=$('app');
const statNames={STR:'Strength',DEX:'Dexterity',CON:'Constitution',INT:'Intelligence',WIS:'Wisdom',CHA:'Charisma',AGI:'Agility',LCK:'Luck'};
const slots=['Main hand','Off hand','Head','Chest','Hands','Feet','Amulet','Ring'];
const resist=['Fire','Cold','Poison','Lightning','Holy','Dark'];
const zones=[{name:'The Whispering Woods',desc:'A trail through a quiet, unfamiliar forest.',level:1,length:6,scale:1,theme:'forest'},{name:'The Hollow Cave',desc:'Something moves beneath the old hills.',level:2,length:8,scale:1.38,theme:'cave'},{name:'The Broken Ruins',desc:'Remnants of a forgotten kingdom.',level:4,length:10,scale:1.9,theme:'ruins'}];
const foes=[{name:'Wild Rat',hp:23,atk:5,xp:15,color:'#8a7969'},{name:'Goblin Scout',hp:38,atk:8,xp:22,color:'#829452'},{name:'Forest Wolf',hp:45,atk:9,xp:26,color:'#a3a4a0'},{name:'Bandit',hp:51,atk:10,xp:30,color:'#9f785d'},{name:'Stone Guardian',hp:65,atk:12,xp:38,color:'#8d9ca1'}];
const deaths=[{place:'A perfectly ordinary park',cause:'A grand piano falls from above. You never hear the final note.',type:'piano'},{place:'A quiet street',cause:'An ice cream truck takes an unexpectedly dramatic turn.',type:'truck'},{place:'A peaceful lakeside',cause:'A single bolt of lightning strikes on a cloudless day.',type:'lightning'},{place:'A city square',cause:'One banana peel. One fountain. One remarkably unlucky human.',type:'banana'}];
const colors=['#c69a6d','#9b6246','#e0bb91','#79513b'], outfits=['#6c8e89','#89739f','#a16b59','#788b50'];
let state=null,screen='home',tab='character',draft={name:'',skin:0,outfit:0,hair:0},death=null,toastTimer,storageOk=true,lastPaint=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rnd(0,a.length-1)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function item(name,slot,rarity,value,mods={}){return {id:uid(),name,slot,rarity,value,mods}}
function save(){try{if(state)localStorage.setItem(KEY,JSON.stringify(state));else localStorage.removeItem(KEY);storageOk=true}catch(e){storageOk=false;$('footer').textContent='Local storage unavailable · progress lasts only in this tab'}}
function read(){try{let s=JSON.parse(localStorage.getItem(KEY));return s&&s.version===1?s:null}catch(e){return null}}
function notify(t){$('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2700)}
function mods(k){return Object.values(state.gear).reduce((a,i)=>a+(i?.mods?.[k]||0),0)}
function stat(k){return state.stats[k]+mods(k)}
function maxHP(){return 60+4*stat('CON')+8*(state.level-1)}function maxMP(){return 20+3*stat('WIS')+4*(state.level-1)}function armor(){return 10+mods('AC')+Math.floor((stat('DEX')-10)/2)}function attack(){return 5+Math.floor(stat('STR')/2)+mods('ATK')+state.level-1}function xpGoal(){return 60+40*state.level}
function makeState(){return {version:1,name:draft.name.trim()||'The Wanderer',skin:draft.skin,outfit:draft.outfit,hair:draft.hair,level:1,xp:0,points:0,stats:Object.fromEntries(Object.keys(statNames).map(k=>[k,10])),hp:100,mp:50,gold:0,potions:3,potionThreshold:35,autoSpark:true,gear:{'Main hand':item('Rusty Sword','Main hand','common',8,{ATK:2}),'Chest':item('Simple Tunic','Chest','common',5,{AC:1})},bag:[],kills:0,expeditions:0,days:1,population:1,wood:0,huts:0,companions:[],pet:null,run:null,phase:'camp',history:[]}}
function log(t){if(state.run){state.run.log.unshift(t);state.run.log=state.run.log.slice(0,25)}}
function bar(label,v,max,cls=''){return `<div class="row spread"><small>${label}</small><small>${Math.max(0,Math.round(v))} / ${max}</small></div><div class="bar ${cls}"><i style="width:${clamp(v/max*100,0,100)}%"></i></div>`}
function btn(t,a,c='',disabled=false){return `<button class="${c}" data-act="${a}" ${disabled?'disabled':''}>${t}</button>`}
function home(){screen='home';let s=read();app.innerHTML=`<section class="hero"><div class="eyebrow">A second life · A single chance</div><h1>The Divine<br>Game</h1><p class="quote">One life. No second chances.<br>Divinity awaits.</p><canvas class="scene" id="scene" width="480" height="240"></canvas><div class="panel stack">${s?btn(`Continue · ${esc(s.name)} (Lv. ${s.level})`,'continue','primary'):''}${btn('New Game','new',s?'':'primary')}<small>Fantasy RPG · Auto-battle · Settlement building · Permadeath</small></div></section>`}
function create(){screen='create';app.innerHTML=`<section class="hero"><div class="eyebrow">Before it all ends</div><h2>Create your character</h2><canvas class="portrait" id="portrait" width="64" height="64"></canvas><div class="panel fields"><label>Name<input id="name" maxlength="24" placeholder="The Wanderer" value="${esc(draft.name)}"></label><label>Appearance<select id="skin">${['Warm','Copper','Fair','Deep'].map((x,i)=>`<option value="${i}" ${draft.skin===i?'selected':''}>${x}</option>`).join('')}</select></label><label>Hair<select id="hair">${['Dark','Blond','Silver','Auburn'].map((x,i)=>`<option value="${i}" ${draft.hair===i?'selected':''}>${x}</option>`).join('')}</select></label><label>Clothing<select id="outfit">${['Teal','Violet','Rust','Olive'].map((x,i)=>`<option value="${i}" ${draft.outfit===i?'selected':''}>${x}</option>`).join('')}</select></label><small>No class selection. Your choices will shape your destiny.</small>${btn('Begin your ordinary life','die','primary')}${btn('Back','home','ghost')}</div></section>`;['name','skin','hair','outfit'].forEach(k=>$(k).addEventListener('input',e=>{draft[k]=k==='name'?e.target.value:Number(e.target.value)}))}
function deathScreen(){screen='death';death=pick(deaths);app.innerHTML=`<section class="hero"><div class="eyebrow">Earth · Your previous life</div><h2>${death.place}</h2><canvas id="scene" class="scene" width="480" height="240"></canvas><p class="quote">${death.cause}</p>${btn('…','intro','primary')}</section>`}
function intro(){screen='intro';app.innerHTML=`<section class="hero"><div class="eyebrow">A voice beyond the veil</div><div class="panel stack" style="padding:28px 18px;background:#1e1d26"><h2>Welcome to The Divine Game</h2><p class="quote">Your previous life has come to an unfortunate end.</p><p>To keep things simple, you need not choose a class. You simply begin.</p><p>If you survive, you may become one of the lucky few worthy of competing in The Divine Game.</p><p class="quote gold">The winner ascends to divinity.</p><p>And the rest? Well… there are no second chances.</p>${btn('Begin your new life','begin','primary')}</div></section>`}
function gainXP(n){state.xp+=n;while(state.xp>=xpGoal()){state.xp-=xpGoal();state.level++;state.points+=3;state.hp=Math.min(maxHP(),state.hp+20);state.mp=Math.min(maxMP(),state.mp+12);log(`Level ${state.level}! +3 attribute points.`);notify(`Level ${state.level} · 3 attribute points`);}}
function itemText(i){return Object.entries(i.mods).map(([k,v])=>`+${v} ${k}`).join(' · ')||'Treasure'}
function gearList(){return slots.map(s=>{let i=state.gear[s];return `<div class="item"><div><small>${s}</small><b class="${i?.rarity||'muted'}">${i?esc(i.name):'Empty'}</b>${i?`<small>${itemText(i)}</small>`:''}</div>${i?btn('Remove','unequip:'+i.id,'small',!!state.run):''}</div>`}).join('')}
function inventory(){let bag=state.bag.map(i=>`<div class="item"><div><b class="${i.rarity}">${esc(i.name)}</b><small>${itemText(i)} · ${i.value} gold</small></div><div class="row">${i.slot?btn('Equip','equip:'+i.id,'small',!!state.run):''}${btn('Sell','sell:'+i.id,'small',!!state.run)}</div></div>`).join('');return `<div class="stack"><div class="row spread"><h3>Backpack</h3><small>${state.bag.length} items</small></div><div class="item"><span>🧪 Healing potion</span><b>×${state.potions}</b></div>${bag||'<p class="muted">No other items yet.</p>'}</div>`}
function character(){return `<div class="row spread"><div><h2>${esc(state.name)}</h2><small>Level ${state.level} · Classless wanderer</small></div><canvas id="portrait" class="portrait" style="width:70px;height:70px;margin:0" width="64" height="64"></canvas></div>${bar('Health',state.hp,maxHP(),'hp')}${bar('Mana',state.mp,maxMP(),'mp')}${bar('Experience',state.xp,xpGoal(),'xp')}<div class="section"><div class="row spread"><h3>Attributes</h3><small>${state.points} points available</small></div><div class="statgrid" style="margin-top:8px">${Object.entries(statNames).map(([k,n])=>`<div class="stat" title="${n}"><small>${k}</small><b>${stat(k)}</b>${state.points?btn('+','stat:'+k,'small',!!state.run):''}</div>`).join('')}</div></div><div class="section"><h3>Defenses</h3><div class="statgrid" style="margin-top:8px"><div class="stat"><small>Armor class</small><b>${armor()}</b></div><div class="stat"><small>Attack</small><b>${attack()}</b></div>${resist.map(r=>`<div class="stat"><small>${r}</small><b>${mods(r)}%</b></div>`).join('')}</div></div>`}
function skillPanel(){return `<div class="stack"><h3>Automatic abilities</h3><div class="item"><div><b>⚔ Basic attack</b><small>Every 1.2 seconds · No mana cost</small></div><span class="tag">Always</span></div><div class="item"><div><b>✦ Arcane spark</b><small>6 mana · 4 second cooldown · INT damage</small></div>${btn(state.autoSpark?'Enabled':'Disabled','spark','small',!!state.run)}</div><div class="item"><div><b>🧪 Healing potion</b><small>Restores 35 health · 8 second cooldown</small></div></div><label>Use below <span id="thresholdText">${state.potionThreshold}% health</span><input id="threshold" type="range" min="10" max="80" step="5" value="${state.potionThreshold}" ${state.run?'disabled':''}></label><small>Abilities can be configured safely at camp.</small></div>`}
function side(){return `<aside class="panel"><nav class="nav">${['character','gear','inventory','skills'].map(t=>btn(t[0].toUpperCase()+t.slice(1),'tab:'+t,tab===t?'active':'ghost')).join('')}</nav><div class="section" id="sideContent">${tab==='character'?character():tab==='gear'?`<div class="loot">${gearList()}</div>`:tab==='inventory'?inventory():skillPanel()}</div></aside>`}
function camp(){screen='camp';state.phase='camp';app.innerHTML=`<div class="layout"><div class="stack"><section class="panel stack"><div class="row spread"><div><div class="eyebrow">Your settlement</div><h2>${state.huts?'The fledgling settlement':'A lonely encampment'}</h2></div><span class="tag">Day ${state.days}</span></div><canvas class="scene" id="scene" width="480" height="240"></canvas><div class="row spread"><span>◈ <b>${state.gold}</b> gold</span><span>▰ <b>${state.wood}</b> wood</span><span>♟ <b>${state.population}</b> people</span></div><div class="buttons2">${btn('Rest · restore HP & MP','rest','',state.hp===maxHP()&&state.mp===maxMP())}${btn('Buy potion · 12 gold','buy','',state.gold<12)}</div><div class="row spread"><small>${state.huts} huts built · ${state.population} inhabitants</small>${btn('Build hut · 25 wood','hut','small',state.wood<25)}</div><small>Every hut offers a new place for a survivor. The camp will grow as you explore.</small></section><section class="panel stack"><div class="eyebrow">Into the unknown</div><h2>Choose an adventure</h2>${zones.map((z,i)=>`<div class="item ${state.level<z.level?'locked':''}"><div><b>${z.name}</b><small>${z.desc}</small><small>Level ${z.level}+ · ${z.length} encounters</small></div>${btn(state.level<z.level?'Locked':'Explore','explore:'+i,'small '+(i===0?'primary':''),state.level<z.level)}</div>`).join('')}<small class="dangertext">Death is permanent. Prepare before entering.</small></section>${state.history.length?`<section class="panel"><h3>Last expedition</h3><p class="muted">${esc(state.history[0])}</p></section>`:''}</div>${side()}</div>`;bindThreshold();save()}
function bindThreshold(){if($('threshold'))$('threshold').addEventListener('input',e=>{state.potionThreshold=+e.target.value;$('thresholdText').textContent=state.potionThreshold+'% health';save()})}
function startRun(i){if(state.level<zones[i].level)return;state.run={zone:i,step:0,walk:0,enemy:null,loot:[],gold:0,wood:0,survivors:0,bonus:0,cd:{attack:0,spark:0,potion:0,enemy:0,flee:0},log:['You leave the safety of camp.'],paused:false,flash:0};state.phase='adventure';tab='character';save();adventure()}
function fleeChance(){let r=state.run;return clamp(25+2*(stat('AGI')-10)+Math.floor((stat('LCK')-10)/2)-r.zone*5+r.bonus,5,95)}
function adventure(){screen='adventure';let r=state.run,z=zones[r.zone];app.innerHTML=`<div class="layout"><div class="stack"><section class="panel stack"><div class="row spread"><div><div class="eyebrow">Expedition</div><h2>${z.name}</h2></div>${btn(r.paused?'Resume':'Pause','pause','small')}</div><div id="progress"></div><canvas id="scene" class="scene" width="480" height="240"></canvas><div id="enemy"></div><div id="combatVitals"></div><div class="skills" id="cooldowns"></div><div class="buttons2" id="fleeButtons"></div><div id="runLoot"></div><div class="log" id="combatLog"></div><small>Combat and travel are automatic. Discard a random treasure to improve your escape chance. You keep the remaining loot if you escape.</small></section></div>${side()}</div>`;bindThreshold();updateRunUI()}
function updateRunUI(){if(screen!=='adventure'||!state?.run)return;let r=state.run,z=zones[r.zone];$('progress').innerHTML=bar(`Expedition progress · ${Math.round(r.step/z.length*100)}%`,r.step,z.length,'progress');$('enemy').innerHTML=r.enemy?bar(esc(r.enemy.name),r.enemy.hp,r.enemy.max,'hp'):'<small>'+ (r.paused?'Expedition paused.':'Traveling…')+'</small>';$('combatVitals').innerHTML=bar('Health',state.hp,maxHP(),'hp')+bar('Mana',state.mp,maxMP(),'mp');$('cooldowns').innerHTML=[['⚔','Attack',r.cd.attack],['✦','Spark',r.cd.spark],['🧪',`Potion ×${state.potions}`,r.cd.potion]].map(([i,n,c])=>`<div class="skill"><span>${i}</span><b>${n}</b><small>${c>0?c.toFixed(1)+'s':'Ready'}</small></div>`).join('');let fb=btn(`Flee · ${fleeChance()}%`,'flee','danger',r.paused||r.cd.flee>0)+btn('Discard treasure','discard','',r.paused||!r.loot.length);if($('fleeButtons').dataset.html!==fb){$('fleeButtons').innerHTML=fb;$('fleeButtons').dataset.html=fb;}$('runLoot').innerHTML=`<div class="row spread"><small>Expedition loot</small><b class="gold">${r.gold} gold · ${r.wood} wood</b></div><div class="row">${r.loot.map(i=>`<span class="tag ${i.rarity}">${esc(i.name)}</span>`).join('')||'<small>No treasure collected.</small>'}</div>`;$('combatLog').innerHTML=r.log.map(l=>`<div>${esc(l)}</div>`).join('');if(tab==='character')$('sideContent').innerHTML=character();else if(tab==='inventory')$('sideContent').innerHTML=inventory()}
function treasure(){let chance=Math.random(),rarity=chance<.58?'common':chance<.86?'uncommon':chance<.98?'rare':'epic',rank=['common','uncommon','rare','epic'].indexOf(rarity)+1;let pool=[['Iron Sword','Main hand',{ATK:rank*3}],['Leather Vest','Chest',{AC:rank*2,CON:rank}],['Oak Shield','Off hand',{AC:rank*2}],['Wanderer Boots','Feet',{AGI:rank*2}],['Copper Ring','Ring',{LCK:rank,Fire:rank*5}],['Ashwood Wand','Main hand',{ATK:rank,INT:rank*3}],['Ancient Coin',null,{}],['Silver Chalice',null,{}],['Moonstone',null,{}],['Traveler Hood','Head',{WIS:rank,Cold:rank*5}],['Leather Gloves','Hands',{DEX:rank}],['Amber Pendant','Amulet',{Poison:rank*5,INT:rank}]];let [n,s,m]=pick(pool);return item(n,s,rarity,rank*rnd(7,14),m)}
function encounter(){let r=state.run,z=zones[r.zone],roll=Math.random();if(roll<.12){let i=treasure();r.loot.push(i);r.gold+=rnd(3,8);log(`You find a hidden cache: ${i.name}.`);r.step++;gainXP(12);return}if(roll<.22){let damage=rnd(5,13)+r.zone*3;state.hp-=damage;log(`A hidden trap deals ${damage} damage.`);r.step++;gainXP(8);return}if(roll<.32){r.wood+=rnd(8,15);log('You gather useful timber.');r.step++;gainXP(8);return}if(roll<.39){r.survivors++;log('A lost traveler asks to join your camp.');r.step++;gainXP(15);return}let f=pick(foes.slice(0,Math.min(foes.length,3+r.zone)));let scale=z.scale*(1+r.step*.045);let hp=Math.round(f.hp*scale);r.enemy={...f,hp,max:hp,atk:Math.round(f.atk*scale),xp:Math.round(f.xp*z.scale)};r.cd.enemy=1.4;r.cd.attack=.3;log(`${f.name} blocks your path.`)}
function finish(won){let r=state.run,z=zones[r.zone];state.gold+=r.gold;state.wood+=r.wood;state.bag.push(...r.loot);let admitted=Math.min(r.survivors,Math.max(0,1+state.huts*2-state.population));state.population+=admitted;state.expeditions++;state.days++;if(won){state.gold+=10+5*r.zone;gainXP(20+10*r.zone)}let text=`${won?'Completed':'Escaped'} ${z.name} · ${r.gold+(won?10+5*r.zone:0)} gold, ${r.wood} wood, ${r.loot.length} items${admitted?`, ${admitted} new residents`:''}.${r.survivors>admitted?' Some travelers left: not enough shelter.':''}`;state.history.unshift(text);state.history=state.history.slice(0,10);state.run=null;tab='character';save();camp();notify(won?'Expedition completed!':'You escaped alive.');}
function gameOver(){let dead={name:state.name,level:state.level,kills:state.kills,days:state.days};state=null;save();screen='gameover';app.innerHTML=`<section class="hero"><div class="eyebrow dangertext">Permadeath</div><div class="panel stack"><h1 style="color:var(--red)">Your story ends here.</h1><p class="quote">You were given a second life. There will not be a third.</p><div class="statgrid"><div class="stat">Level <b>${dead.level}</b></div><div class="stat">Days <b>${dead.days}</b></div><div class="stat">Kills <b>${dead.kills}</b></div></div><p class="muted">${esc(dead.name)} and their settlement are gone. The local save has been erased.</p>${btn('Start a new life','new','primary')}${btn('Main menu','home','ghost')}</div></section>`}
function tick(){if(screen!=='adventure'||!state?.run||state.run.paused)return;let r=state.run,z=zones[r.zone],dt=.2;for(let k in r.cd)r.cd[k]=Math.max(0,r.cd[k]-dt);r.flash=Math.max(0,r.flash-dt);if(state.hp<=0){gameOver();return}if(state.hp/maxHP()*100<=state.potionThreshold&&state.potions>0&&r.cd.potion<=0){state.potions--;state.hp=Math.min(maxHP(),state.hp+35);r.cd.potion=8;log('You drink a healing potion (+35 HP).')}if(r.enemy){let e=r.enemy;if(r.cd.attack<=0){let crit=Math.random()<clamp(.05+(stat('DEX')-10)*.005,.01,.5);let d=Math.max(1,attack()+rnd(-2,2))*(crit?2:1);e.hp-=d;r.cd.attack=1.2;r.flash=.25;log(`${crit?'Critical! ':''}You strike for ${d}.`)}if(e.hp>0&&state.autoSpark&&r.cd.spark<=0&&state.mp>=6){let d=4+stat('INT')+state.level;state.mp-=6;e.hp-=d;r.cd.spark=4;log(`Arcane spark deals ${d}.`)}if(e.hp>0&&r.cd.enemy<=0){let d=Math.max(1,e.atk+rnd(-2,2)-Math.floor((armor()-10)/2));state.hp-=d;r.cd.enemy=1.5;log(`${e.name} hits you for ${d}.`)}if(state.hp<=0){gameOver();return}if(e.hp<=0){state.kills++;r.gold+=rnd(4,10)+r.zone*2;r.wood+=rnd(1,5);if(Math.random()<.78){let i=treasure();r.loot.push(i);log(`Loot: ${i.name}.`)}gainXP(e.xp);log(`${e.name} defeated. +${e.xp} XP.`);r.enemy=null;r.step++;r.walk=0;r.bonus=Math.max(0,r.bonus-5)}}else{r.walk+=dt;state.mp=Math.min(maxMP(),state.mp+dt*.8);if(r.step>=z.length){finish(true);return}if(r.walk>=2.6){r.walk=0;encounter();if(state.hp<=0){gameOver();return}}}save();updateRunUI()}
app.addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b||b.disabled)return;let [a,v]=b.dataset.act.split(':');if(a==='home'){home();return}if(a==='new'){if(read()&&!confirm('Starting a new life permanently erases your current character. Continue?'))return;state=null;save();draft={name:'',skin:0,outfit:0,hair:0};create();return}if(a==='continue'){state=read();if(!state){home();return}tab='character';if(state.hp<=0){gameOver();return}if(state.run)adventure();else camp();return}if(a==='die'){deathScreen();return}if(a==='intro'){intro();return}if(a==='begin'){state=makeState();tab='character';camp();return}if(!state)return;if(a==='tab'){tab=v;state.run?adventure():camp();return}if(a==='pause'){state.run.paused=!state.run.paused;save();adventure();return}if(a==='flee'){let r=state.run;if(!r||r.paused||r.cd.flee>0)return;if(Math.random()*100<fleeChance()){finish(false);return}r.cd.flee=5;log('Escape failed! You stumble and lose precious time.');if(r.enemy){state.hp-=Math.max(1,Math.floor(r.enemy.atk/2));if(state.hp<=0){gameOver();return}}save();updateRunUI();return}if(a==='discard'){let r=state.run;if(!r||r.paused||!r.loot.length)return;let i=r.loot.splice(rnd(0,r.loot.length-1),1)[0],bonus=clamp(Math.round(i.value*.8),4,35);r.bonus+=bonus;log(`You discard ${i.name}. Escape chance +${bonus}%.`);save();updateRunUI();return}if(state.run)return;if(a==='explore'){startRun(+v);return}if(a==='rest'){state.hp=maxHP();state.mp=maxMP();state.days++;notify('You feel rested.')}if(a==='buy'&&state.gold>=12){state.gold-=12;state.potions++;}if(a==='hut'&&state.wood>=25){state.wood-=25;state.huts++;notify('A new hut has been built.')}if(a==='spark')state.autoSpark=!state.autoSpark;if(a==='stat'&&state.points>0&&v in statNames){let h=maxHP(),m=maxMP();state.stats[v]++;state.points--;state.hp+=maxHP()-h;state.mp+=maxMP()-m;}if(a==='equip'){let n=state.bag.findIndex(i=>i.id===v);if(n>=0&&state.bag[n].slot){let i=state.bag.splice(n,1)[0];if(state.gear[i.slot])state.bag.push(state.gear[i.slot]);state.gear[i.slot]=i;notify(`${i.name} equipped.`)}}if(a==='unequip'){let s=slots.find(k=>state.gear[k]?.id===v);if(s){state.bag.push(state.gear[s]);delete state.gear[s]}}if(a==='sell'){let n=state.bag.findIndex(i=>i.id===v);if(n>=0){state.gold+=state.bag[n].value;state.bag.splice(n,1)}}state.hp=Math.min(state.hp,maxHP());state.mp=Math.min(state.mp,maxMP());camp()});
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function poly(c,pts,col){c.fillStyle=col;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(Math.round(x),Math.round(y)):c.moveTo(Math.round(x),Math.round(y)));c.closePath();c.fill()}function ellipse(c,x,y,w,h,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,w,h,0,0,Math.PI*2);c.fill()}
function sprite(c,x,y,s,p,walk=0,sword=false){let skin=colors[p.skin||0],shirt=outfits[p.outfit||0],hair=['#352e2c','#d7b46e','#c7cfcb','#8c4431'][p.hair||0],leg=Math.sin(walk)*2;c.save();c.translate(Math.round(x),Math.round(y));c.scale(s,s);ellipse(c,0,1,10,3,'#0c141480');rect(c,-6,-11,5,11+leg,'#313e42');rect(c,2,-11,5,11-leg,'#313e42');rect(c,-7,-25,15,15,shirt);rect(c,-10,-23,4,11,skin);rect(c,8,-23,4,11,skin);rect(c,-6,-37,13,12,skin);rect(c,-7,-39,15,5,hair);rect(c,-7,-36,3,6,hair);rect(c,3,-33,2,2,'#282923');rect(c,-7,-12,15,3,'#574434');if(sword){rect(c,10,-15,5,3,'#d0ae70');poly(c,[[13,-17],[25,-32],[28,-33],[27,-29],[15,-15]],'#d8dfdc')}c.restore()}
function tree(c,x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);ellipse(c,0,9,19,8,'#152c2470');rect(c,-3,-5,6,17,'#66523b');poly(c,[[-23,3],[0,-29],[23,3]],'#284c3b');poly(c,[[-19,-8],[0,-39],[19,-8]],'#37634a');poly(c,[[-13,-20],[0,-43],[13,-20]],'#4b7956');c.restore()}
function tent(c,x,y){ellipse(c,x,y+19,39,11,'#243b29');poly(c,[[x-35,y+18],[x-4,y-31],[x+35,y+18]],'#c0a06b');poly(c,[[x-4,y-31],[x+35,y+18],[x+54,y+5],[x+15,y-32]],'#90794f');poly(c,[[x-15,y+18],[x-4,y-8],[x+9,y+18]],'#493c2f');rect(c,x-4,y-34,20,3,'#dac197');}
function hut(c,x,y){ellipse(c,x,y+15,24,7,'#243b29');rect(c,x-21,y-8,42,24,'#a78657');rect(c,x-4,y+3,9,13,'#60442e');rect(c,x-14,y-2,7,7,'#d8bc79');poly(c,[[x-27,y-7],[x,y-29],[x+27,y-7]],'#774b3d');rect(c,x+9,y-23,5,13,'#666862')}
function campDraw(c,t){rect(c,0,0,480,240,'#4c6c40');for(let i=0;i<130;i++){let x=(i*67+23)%480,y=(i*43+17)%240;rect(c,x,y,3+i%3,2,i%2?'#587a49':'#405f3a')}ellipse(c,240,126,124,79,'#8d8960');ellipse(c,240,126,112,68,'#9b936a');for(let i=0;i<17;i++){let x=(i*73+13)%480,y=(i*41+17)%240;if(x<117||x>370||y<32||y>210)tree(c,x,y,.7+i%3*.18)}tent(c,230,111);ellipse(c,237,171,15,7,'#5a5745');for(let i=0;i<7;i++)ellipse(c,237+Math.cos(i*.9)*11,171+Math.sin(i*.9)*5,3,2,'#92958a');poly(c,[[228,171],[231,159+Math.sin(t*7)*3],[237,164],[241,153+Math.sin(t*8)*3],[246,171]],'#e28b45');poly(c,[[232,171],[238,160],[241,171]],'#f8d37b');let count=state?.huts||0;for(let i=0;i<Math.min(count,12);i++){let a=i*2.4;hut(c,240+Math.cos(a)*(70+Math.floor(i/5)*24),119+Math.sin(a)*(42+Math.floor(i/5)*16))}if(state){for(let i=0;i<Math.min(state.population-1,18);i++){let a=t*.4+i*2.4;let x=240+Math.cos(a)*(40+i%4*13),y=124+Math.sin(a)*(20+i%4*9);rect(c,x,y,3,4,'#e1c79a');rect(c,x,y+4,3,5,outfits[i%4])}sprite(c,190,174,.8,state,0,false)}}
function landscape(c,t,zone,travel){let cave=zone==='cave',ruins=zone==='ruins';rect(c,0,0,480,240,cave?'#202630':ruins?'#536565':'#263d38');if(cave){for(let i=0;i<13;i++){let x=(i*61-(travel*5)%61+480)%480;poly(c,[[x-30,0],[x+12,0],[x-7,55+i%4*12]],'#3a414a');poly(c,[[x-25,171],[x+25,171],[x,110+i%4*10]],'#41434b')}}else{ellipse(c,383,47,26,26,'#d4cda1');for(let i=0;i<11;i++){let x=(i*62-(travel*7)%62+480)%480;poly(c,[[x-80,168],[x,42+i%3*17],[x+82,168]],'#334b45')}for(let i=0;i<12;i++){let x=(i*53-(travel*14)%53+480)%480;if(ruins){rect(c,x,63+i%3*14,22,108,'#687671');rect(c,x-4,62+i%3*14,30,6,'#82918b')}else tree(c,x,150,1.4+i%3*.35)}}rect(c,0,171,480,69,cave?'#45444a':'#615b43');rect(c,0,174,480,6,cave?'#6d6a66':'#85805a');for(let i=0;i<36;i++){let x=(i*37-(travel*30)%37+480)%480;rect(c,x,183+(i*13)%53,5+i%8,2,cave?'#57565b':'#776b4e')}}
function enemyDraw(c,e,x,y,t){ellipse(c,x,y,22,5,'#12191890');let col=e.color;if(e.name.includes('Rat')||e.name.includes('Wolf')){rect(c,x-17,y-16,31,11,col);rect(c,x-25,y-20,13,12,col);poly(c,[[x-24,y-20],[x-23,y-29],[x-15,y-20]],col);rect(c,x-20,y-16,3,2,'#f4d58d');rect(c,x-14,y-6,4,6,col);rect(c,x+8,y-6,4,6,col);poly(c,[[x+11,y-15],[x+29,y-24],[x+22,y-10]],col)}else{rect(c,x-9,y-24,18,17,col);rect(c,x-11,y-40,22,16,col);poly(c,[[x-9,y-35],[x-24,y-42],[x-16,y-29]],col);poly(c,[[x+9,y-35],[x+24,y-42],[x+16,y-29]],col);rect(c,x-8,y-34,4,3,'#ffd277');rect(c,x+4,y-34,4,3,'#ffd277');rect(c,x-7,y-7,6,7,'#4b453e');rect(c,x+3,y-7,6,7,'#4b453e');rect(c,x-15,y-24,6,15,col);rect(c,x+9,y-24,6,15,col)}}
function drawDeath(c,t){rect(c,0,0,480,240,'#8eafb0');rect(c,0,130,480,110,'#72916a');for(let i=0;i<6;i++)tree(c,25+i*87,130,1.4);rect(c,0,177,480,29,'#b6b09a');sprite(c,210,190,1.5,draft,0);if(death.type==='piano'){let y=60+Math.sin(t*3)*5;rect(c,186,y,75,36,'#3e3433');rect(c,183,y+31,79,9,'#e9e1c8');for(let i=0;i<9;i++)rect(c,187+i*8,y+31,3,6,'#333');rect(c,191,y+39,5,12,'#3e3433');rect(c,250,y+39,5,12,'#3e3433')}if(death.type==='truck'){rect(c,280,129,111,46,'#e1c5b8');rect(c,280,144,30,20,'#9bc2c5');rect(c,319,140,57,9,'#d47f90');ellipse(c,300,177,10,10,'#343638');ellipse(c,373,177,10,10,'#343638')}if(death.type==='lightning')poly(c,[[221,0],[198,52],[226,51],[198,114],[248,42],[221,42],[245,0]],'#f8e98e');if(death.type==='banana'){ellipse(c,270,183,52,15,'#647e82');ellipse(c,270,180,45,10,'#95b8bc');poly(c,[[223,194],[234,187],[245,194],[234,192],[225,200]],'#f3d16b')}}
function draw(ts){let t=ts/1000,c=$('scene')?.getContext('2d'),p=$('portrait')?.getContext('2d');if(p){rect(p,0,0,64,64,'#263a33');sprite(p,32,57,1.3,screen==='create'?draft:state||draft)}if(c){c.imageSmoothingEnabled=false;if(screen==='camp'||screen==='home'){campDraw(c,t);if(screen==='home'){rect(c,0,0,480,240,'#14211f38');for(let i=0;i<30;i++){let x=(i*87+15)%480,y=(i*43+11)%124;rect(c,x,y,1,1,'#e7d7a8')}}}else if(screen==='death')drawDeath(c,t);else if(screen==='adventure'&&state?.run){let r=state.run,tm=r.paused?0:t;landscape(c,tm,zones[r.zone].theme,r.step*3+r.walk);let walk=r.enemy?0:tm*9;sprite(c,112+(r.enemy&&r.flash>0?7:0),177,1.65,state,walk,true);if(r.enemy){enemyDraw(c,r.enemy,346,177,tm);if(r.flash>0)poly(c,[[145,116],[162,111],[152,129]],'#f8deb1');rect(c,314,105,64,5,'#3e282c');rect(c,314,105,64*clamp(r.enemy.hp/r.enemy.max,0,1),5,'#d36e69')}if(r.paused){rect(c,0,0,480,240,'#10171699');c.fillStyle='#e7e5d7';c.font='bold 19px sans-serif';c.textAlign='center';c.fillText('PAUSED',240,115)}}}requestAnimationFrame(draw)}
setInterval(tick,200);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state?.run){state.run.paused=true;save();adventure()}});home();requestAnimationFrame(draw);
</script></body></html>
